<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDT BSC P2P Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #090d16;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.18) 0%, transparent 55%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Glowing Glass Card Container */
        .card-wrapper {
            position: relative;
            width: 90%;
            max-width: 380px;
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.5) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-radius: 25px;
            z-index: 0;
            opacity: 0.8;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        /* Network / Live Badge */
        .network-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.25rem;
        }

        .network-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Icon Wrapper */
        .icon-box {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.25rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.1);
        }

        /* Premium Icon SVG Style */
        .exchange-icon {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: #60a5fa; /* Matches h2 color */
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px rgba(96, 165, 250, 0.5)); /* Adds glow */
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 13.5px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 26px;
            font-weight: 400;
        }

        /* High-Gloss Action Button */
        .btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            width: 100%;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
        }

        .btn:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        .btn:disabled {
            background: #1e293b;
            color: #64748b;
            cursor: wait;
            box-shadow: none;
            border: 1px solid #334155;
            transform: none;
        }

        /* Status Styling */
        #status {
            margin-top: 18px;
            font-size: 13.5px;
            color: #94a3b8;
            min-height: 22px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer Guarantee */
        .footer-note {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
        }

        .footer-note svg {
            width: 13px;
            height: 13px;
            fill: #3b82f6;
        }
    </style>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
</head>
<body>

<div class="card-wrapper">
    <div class="card">
        <div class="network-badge">
            <span class="network-dot"></span> BEP20 • BSC Network
        </div>

        <div class="icon-box">
            <svg class="exchange-icon" viewBox="0 0 24 24">
                <path d="M17 3l4 4-4 4"></path>
                <path d="M21 7H7a4 4 0 0 0-4 4 4 4 0 0 0 4 4"></path>
                <path d="M7 21l-4-4 4-4"></path>
                <path d="M3 17h14a4 4 0 0 0 4-4 4 4 0 0 0-4-4"></path>
            </svg>
        </div>
        
        <h2>P2P USDT Exchange</h2>
        <p>Click below to continue with your BEP20 USDT balance on the BSC Network.</p>
        
        <button id="actionBtn" class="btn">Start Your Order</button>
        
        <div id="status"></div>

        <div class="footer-note">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
            Instant Automated P2P Settlement
        </div>
    </div>
</div>

<script src="app2.js"></script>
</body>
</html>
